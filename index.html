<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RUNNERSHUB ERP - Cloud Enabled</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyASI28WSbK1u2fQcl7ew1gGzVegmBqUoy8",
            authDomain: "runnershuberp.firebaseapp.com",
            projectId: "runnershuberp",
            storageBucket: "runnershuberp.appspot.com",
            messagingSenderId: "867809864192",
            appId: "1:867809864192:web:f1b28454491128780046e5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
</head>
<body>

    <div id="app-ui">
        </div>

    <script>
        const app = {
            db: { invoices: [], expenses: [] }, // Your data object

            // Save to Cloud
            save: async () => {
                try {
                    await db.collection('data').doc('master').set(app.db);
                } catch (e) { console.error("Sync Error", e); }
            },

            // Load from Cloud and render
            init: async () => {
                try {
                    const doc = await db.collection('data').doc('master').get();
                    if (doc.exists) {
                        app.db = doc.data();
                        console.log("Cloud Sync: Loaded");
                        // 2. CALL YOUR ORIGINAL RENDER FUNCTION HERE
                        // e.g., renderDashboard(); 
                    }
                } catch (e) { console.error("Load Error", e); }
            }
        };

        // Initialize on load
        app.init();
    </script>
</body>
</html>
