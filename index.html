        const db = firebase.firestore();

    </head>
<body>
    
    <script>
        const app = {
            // Your full data object
            db: { 
                settings: { orgName: 'RUNNERSHUB', currency: 'Br' },
                customers: [], vendors: [], items: [],
                quotes: [], invoices: [], expenses: []
            },

            // CLOUD SAVER: Automatically pushes changes to Firestore
            save: async () => {
                try {
                    await db.collection('data').doc('master').set(app.db);
                    console.log("Cloud Sync: Success");
                } catch (e) {
                    console.error("Cloud Sync: Failed", e);
                }
            },

            // CLOUD LOADER: Pulls data on startup
            init: async () => {
                try {
                    const doc = await db.collection('data').doc('master').get();
                    if (doc.exists) {
                        app.db = doc.data();
                        console.log("Cloud Sync: Loaded");
                        // Trigger your UI render functions here
                    }
                } catch (e) {
                    console.error("Cloud Load Failed", e);
                }
            }
        };

        // Initialize App
        app.init();

        /* INSTRUCTIONS FOR INTEGRATION:
           1. Every function that modifies app.db (like adding an invoice or updating a setting) 
              must end with a call to 'app.save()'.
           2. Remove all instances of 'localStorage' from your legacy code.
        */
    </script>
</body>
