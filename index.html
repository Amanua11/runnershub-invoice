<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RUNNERSHUB ERP - Cloud Sync</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyASI28WSbK1u2fQcl7ew1gGzVegmBqUoy8",
            authDomain: "runnershuberp.firebaseapp.com",
            projectId: "runnershuberp",
            storageBucket: "runnershuberp.appspot.com",
            messagingSenderId: "867809864192",
            appId: "1:867809864192:web:f1b28454491128780046e5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
</head>
<body>
    <h1>RUNNERSHUB ERP</h1>
    <div id="status">Connecting to Cloud...</div>

    <script>
        const app = {
            db: { invoices: [] },

            // Syncs your entire app state to the Cloud
            save: async () => {
                try {
                    await db.collection('data').doc('master').set(app.db);
                    document.getElementById('status').innerText = "Cloud Sync Success!";
                } catch (e) {
                    console.error("Sync Error: ", e);
                    document.getElementById('status').innerText = "Sync Failed.";
                }
            },

            // Pulls your entire app state from the Cloud
            init: async () => {
                try {
                    const doc = await db.collection('data').doc('master').get();
                    if (doc.exists) {
                        app.db = doc.data();
                        document.getElementById('status').innerText = "Cloud Data Loaded.";
                    } else {
                        document.getElementById('status').innerText = "Cloud Database Empty.";
                    }
                } catch (e) {
                    document.getElementById('status').innerText = "Init Failed.";
                }
            }
        };

        // Run this on startup
        app.init();
    </script>
</body>
</html>
